name: Loxone events tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loxone_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: loxone_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U loxone_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml
      - run: mvn -B -ntp verify
        env:
          LOXONE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/loxone_test
          LOXONE_TEST_USER: loxone_test
          LOXONE_TEST_PASSWORD: test-only-password
